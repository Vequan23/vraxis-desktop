name: Cross-platform desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Vraxis Desktop
        uses: actions/checkout@v4
        with:
          path: vraxis-desktop

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vraxis-desktop/package-lock.json

      - name: Install Vraxis Desktop
        run: npm ci
        working-directory: vraxis-desktop

      - name: Check Vraxis Desktop
        run: npm run check
        working-directory: vraxis-desktop
