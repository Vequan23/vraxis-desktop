<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vraxis Desktop Example</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #202529; color: #eef3f6; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { max-width: 34rem; padding: 3rem; }
      h1 { font-size: 2.4rem; margin: 0 0 1rem; }
      p { color: #b8c4cb; font-size: 1.1rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Your web app is now a desktop app.</h1>
      <p>This page is packaged locally and runs with Vraxis Desktop’s secure Electron defaults.</p>
    </main>
  </body>
</html>
